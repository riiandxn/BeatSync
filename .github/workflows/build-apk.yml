name: Build BeatSync Cut v2.4 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android permissions for Media, Mic & Storage
        run: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          perms = "\n".join([
              "    <uses-permission android:name=\"android.permission.INTERNET\" />",
              "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />",
              "    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />",
              "    <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />",
              "    <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />",
              "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />",
              "    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />",
              "    <uses-permission android:name=\"android.permission.VIBRATE\" />"
          ])
          if "READ_MEDIA_VIDEO" not in content:
              content = content.replace("<application", perms + "\n    <application", 1)
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload BeatSync Cut v2.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatSync-Cut-v2.4-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
